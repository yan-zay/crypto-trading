# 配置端口
server:
  port: 51102

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    com.tj.id.mapper: DEBUG
    org.apache.ibatis: DEBUG
    com.tj.crypto: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/crypto_trading?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# 所有密钥从环境变量读取，不要在此文件中硬编码
crypto:
  coinglass:
    api-key: ${COINGLASS_API_KEY:}
  proxy:
    host: 127.0.0.1
    port: 10808
  websocket:
    baseUrl: wss://fstream.binance.com/market
    websocketUrl: wss://fstream.binance.com/market
    # WebSocket 客户端实现：okhttp（默认）
    client-type: ${WS_CLIENT_TYPE:okhttp}
  connector:
    symbols: [BTCUSDT, ETHUSDT]
    binance-spot-ws-url: wss://stream.binance.com:9443/stream
    binance-perpetual-ws-url: wss://fstream.binance.com/stream
