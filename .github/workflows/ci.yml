name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crypto_trading
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17.0.15'
        distribution: 'temurin'
        cache: maven

    - name: Enable Maven Wrapper
      run: chmod +x mvnw

    - name: Verify Backend
      run: |
        build_timestamp="$(git show -s --format=%cI HEAD)"
        ./mvnw clean verify -B \
          -Dproject.build.outputTimestamp="$build_timestamp" \
          -Dgit.commit="$GITHUB_SHA"
      env:
        DB_USERNAME: root
        DB_PASSWORD: root
        SPRING_PROFILES_ACTIVE: ci

    - name: Set up Node.js for real browser path
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.19.5'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install real browser path dependencies
      working-directory: frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Startup smoke and non-mocked browser path
      run: |
        java -jar target/crypto-trading.jar --spring.profiles.active=ci > target/startup.log 2>&1 &
        app_pid=$!
        trap 'kill "$app_pid" 2>/dev/null || true' EXIT
        ready=false
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:51105/actuator/health/readiness; then
            ready=true
            break
          fi
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat target/startup.log
            exit 1
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          cat target/startup.log
          exit 1
        fi
        cd frontend
        VITE_API_TARGET=http://127.0.0.1:51104 npm run test:e2e:real
      env:
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Record checksums and build provenance
      shell: bash
      run: |
        sha256sum target/crypto-trading.jar target/bom.json > target/SHA256SUMS
        jq -n \
          --arg commit "$GITHUB_SHA" \
          --arg sourceRef "$GITHUB_REF" \
          --arg buildTimestamp "$(git show -s --format=%cI HEAD)" \
          --arg java "$(java -version 2>&1 | head -n 1)" \
          --arg maven "$(./mvnw --version | head -n 1)" \
          --arg runnerImage "${ImageOS:-unknown}:${ImageVersion:-unknown}" \
          --arg mysqlImage "mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b" \
          --arg builderImage "eclipse-temurin:17-jdk-alpine@sha256:638937c54b6d63f0973a20501973e7c433a36b1f22262bd2b25afa7be5ff8c4a" \
          --arg runtimeImage "eclipse-temurin:17-jre-alpine@sha256:02320dd4ce20e243dfb915c686089cf9315c763084fafbb12d5c9993aee18b57" \
          '{commit:$commit,sourceRef:$sourceRef,buildTimestamp:$buildTimestamp,
            toolchain:{java:$java,maven:$maven,runnerImage:$runnerImage},
            baseImages:[$mysqlImage,$builderImage,$runtimeImage]}' \
          > target/build-provenance.json

    - name: Upload Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: crypto-trading-jar
        path: |
          target/crypto-trading.jar
          target/bom.json
          target/SHA256SUMS
          target/build-provenance.json
        retention-days: 7

  frontend:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.19.5'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: frontend
      run: npm ci

    - name: Audit Production Dependencies
      working-directory: frontend
      run: npm audit --omit=dev --audit-level=high

    - name: Lint
      working-directory: frontend
      run: npm run lint

    - name: Build
      working-directory: frontend
      run: npm run build

    - name: Install Playwright Browser
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Run Browser Contract Tests
      working-directory: frontend
      run: npm run test:e2e

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 7
