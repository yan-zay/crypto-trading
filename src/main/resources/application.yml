# 配置端口
server:
  port: 51104

spring:
  profiles:
    active: dev
#    active: sit
#    active: uat
#    active: pro

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/id_generator?useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

id:
  length: 9

# Coinglass API 配置
crypto:
  coinglass:
    api-key: ${COINGLASS_API_KEY:}
  proxy:
    host: ${PROXY_HOST:127.0.0.1}
    port: ${PROXY_PORT:10808}
  websocket:
    baseUrl: ${BINANCE_WS_BASE_URL:wss://fstream.binance.com}
    websocketUrl: ${BINANCE_WS_URL:wss://fstream.binance.com/ws/btcusdt@kline_1m}
  strategy:
    configs:
      liquidation-spike:
        enabled: true
        threshold-usd: 1000000
        symbols: [BTCUSDT, ETHUSDT]
      macd-cross:
        enabled: true
        symbols: [BTCUSDT, ETHUSDT]
