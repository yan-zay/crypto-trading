# 配置端口
server:
  port: 51104

spring:
  profiles:
    active: dev
#    active: sit
#    active: uat
#    active: pro

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/id_generator?useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

id:
  length: 9

# Coinglass API 配置
crypto:
  binance:
    historical:
      base-url: https://fapi.binance.com
  coinglass:
    api-key: ${COINGLASS_API_KEY:}
  proxy:
    host: ${PROXY_HOST:127.0.0.1}
    port: ${PROXY_PORT:10808}
  websocket:
    baseUrl: ${BINANCE_WS_BASE_URL:wss://fstream.binance.com}
    websocketUrl: ${BINANCE_WS_URL:wss://fstream.binance.com/ws/btcusdt@kline_1m}
  strategy:
    configs:
      liquidation-spike:
        enabled: true
        threshold-usd: 1000000
        symbols: [BTCUSDT, ETHUSDT]
      macd-cross:
        enabled: true
        symbols: [BTCUSDT, ETHUSDT]
  risk:
    max-loss-per-trade-pct: 2.0
    max-daily-loss-pct: 5.0
    max-size-pct: 30.0
    slippage-bps: 5
  factor:
    sma-period: 20
    ema-period: 20
    macd-fast: 12
    macd-slow: 26
    macd-signal: 9
    rsi-period: 14
    bb-period: 20
    bb-std-dev: 2.0
