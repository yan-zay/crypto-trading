# 配置端口
server:
  port: 51102

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    com.tj.id.mapper: DEBUG
    org.apache.ibatis: DEBUG
    com.tj.crypto: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/id_generator?useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# 所有密钥从环境变量读取，不要在此文件中硬编码
crypto:
  coinglass:
    api-key: ${COINGLASS_API_KEY:}
  proxy:
    host: 127.0.0.1
    port: 10808
  websocket:
    baseUrl: wss://fstream.binance.com
    websocketUrl: wss://fstream.binance.com/ws/btcusdt@kline_1m
    # WebSocket 客户端实现：tyrus（默认） 或 okhttp
    client-type: ${WS_CLIENT_TYPE:tyrus}
